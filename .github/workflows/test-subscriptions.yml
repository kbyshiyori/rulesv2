name: test-subscriptions

on:
  workflow_dispatch: {}
  push:
    paths:
      - "subscriptions/**"
      - ".github/workflows/test-subscriptions.yml"
  pull_request:
    paths:
      - "subscriptions/**"
      - ".github/workflows/test-subscriptions.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Test publisher without credentials
        run: python3.12 -m unittest discover -s subscriptions -p 'test_*.py'
      - name: Test Worker without credentials
        run: node --test subscriptions/test_worker.mjs
